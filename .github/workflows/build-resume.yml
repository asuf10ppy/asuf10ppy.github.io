name: Build resume
on:
  push:
    branches: [main]
    paths: ["skills.json", "projects.json", "clubs.json", "certs.json", "scripts/build_resume.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - run: python scripts/build_resume.py
      - run: |
          git config user.name "resume-bot"
          git config user.email "resume-bot@users.noreply.github.com"
          git add resume.pdf
          git diff --staged --quiet || (git commit -m "Rebuild resume" && git push)
